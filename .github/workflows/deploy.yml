name: Teszt és publikálás

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Szintaxis-ellenőrzés
        run: node --check game.js
      - name: Füstteszt
        run: node tests/smoke.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publikálandó fájlok összegyűjtése
        run: |
          mkdir _site && cp index.html game.js _site/
          # a game.js címe minden kiadásnál más, így a böngésző nem a régi, tárolt változatot futtatja
          sed -i "s|src=\"game.js\"|src=\"game.js?v=${GITHUB_SHA}\"|" _site/index.html
          grep -q "game.js?v=${GITHUB_SHA}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
